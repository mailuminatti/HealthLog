name: Build scoped-fix image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/healthlog:scoped-fix-1.47.1
          build-args: |
            NEXT_PUBLIC_APP_VERSION=v1.47.1-scopedfix
            NEXT_PUBLIC_APP_BUILD_SHA=${{ github.sha }}
